# Builds the Docker image, runs the tests inside it, and publishes it to the
# GitHub Container Registry (ghcr.io/<owner>/<repo>).
#
# - Push to main:      tags `latest` and `sha-<commit>`
# - Push of tag v1.2.3: tags `1.2.3` and `1.2`
# - Pull request:      builds and tests only, publishes nothing
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Published as ghcr.io/lukas-scharf-plus/slc_downloader. The older, hand-pushed
  # package "slc-downloader" (up to 0.2.1) refuses pushes from this workflow.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io with the built-in GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags and labels from the branch, tag or commit. It also
      # lowercases the name, which ghcr.io requires.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once and load it locally, so the tests run against the exact image.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: slc-downloader:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image's working directory is /app, which holds src/ and tests/.
      - name: Run tests in the image
        run: >
          docker run --rm slc-downloader:test
          python -m unittest discover -s tests -t .

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
